<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="3600" viewBox="0 0 1800 3600"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#111"/></marker></defs><rect width="1800" height="3600" fill="#ffffff"/><text x="900.0" y="48" font-family="'Times New Roman', Times, serif" font-size="20" font-weight="bold" fill="#111">Figure 1. Hybrid Burmese Programming Tutor — System Workflow</text>
<text x="900.0" y="72" font-family="'Times New Roman', Times, serif" font-size="13" font-weight="normal" fill="#111">Cloud LLM (Gemini / OpenRouter) + local MIIT note retrieval; no on-device fine-tuned weights</text>
<text x="80" y="116" font-family="'Times New Roman', Times, serif" font-size="15" font-weight="bold" fill="#111">Phase I — Knowledge-base preparation (offline)</text>
<rect x="640.0" y="128" width="520" height="58" rx="0" fill="#fff" stroke="#111" stroke-width="1.4"/>
<text x="900.0" y="161.0" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="13" fill="#111">Load corpus: data/miit/*.jsonl</text>
<line x1="900.0" y1="186" x2="900.0" y2="204" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="640.0" y="204" width="520" height="70" rx="0" fill="#fff" stroke="#111" stroke-width="1.4"/>
<text x="900.0" y="234.0" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12" fill="#111">Embed chunk text (GEMINI_EMBED_MODEL,</text>
<text x="900.0" y="251.0" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12" fill="#111">default gemini-embedding-001)</text>
<line x1="900.0" y1="274" x2="900.0" y2="292" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>
<ellipse cx="900.0" cy="302.08" rx="180.0" ry="10.080000000000002" fill="#f4f4f4" stroke="#111" stroke-width="1.4"/>
<path d="M720.0,302.08 V353.92 A180.0,10.080000000000002 0 0 0 1080.0,353.92 V302.08" fill="#f4f4f4" stroke="#111" stroke-width="1.4"/>
<ellipse cx="900.0" cy="353.92" rx="180.0" ry="10.080000000000002" fill="#f4f4f4" stroke="#111" stroke-width="1.4"/>
<text x="900.0" y="324.0" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12" fill="#111">data/miit/index.json</text>
<text x="900.0" y="340.0" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12" fill="#111">(embeddings + metadata)</text>
<line x1="900.0" y1="364" x2="900.0" y2="382" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="640.0" y="382" width="520" height="48" rx="0" fill="#fff" stroke="#111" stroke-width="1.4"/>
<text x="900.0" y="409.5" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12" fill="#111">Clear in-memory MIIT index caches</text>
<line x1="60" y1="452" x2="1740" y2="452" stroke="#111" stroke-width="1.2"/>
<text x="80" y="492" font-family="'Times New Roman', Times, serif" font-size="15" font-weight="bold" fill="#111">Phase II — Deployment and client surfaces</text>
<rect x="640.0" y="506" width="520" height="66" rx="0" fill="#fff" stroke="#111" stroke-width="1.4"/>
<text x="900.0" y="526.0" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="11" fill="#111">preflight_tutor.py: TUTOR_BACKEND=hybrid,</text>
<text x="900.0" y="542.0" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="11" fill="#111">chat API key, index.json if</text>
<text x="900.0" y="558.0" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="11" fill="#111">MIIT_RETRIEVAL=embed</text>
<line x1="900.0" y1="572" x2="900.0" y2="590" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="640.0" y="590" width="520" height="70" rx="0" fill="#fff" stroke="#111" stroke-width="1.4"/>
<text x="900.0" y="620.0" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="12" fill="#111">Client entry (all invoke HybridEngine.answer)</text>
<text x="900.0" y="637.0" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="12" fill="#111">Gradio (history) | HTTP API | CLI (stateless)</text>
<line x1="900.0" y1="660" x2="900.0" y2="678" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="80" y="692" font-family="'Times New Roman', Times, serif" font-size="15" font-weight="bold" fill="#111">Phase III — Ask-time routing (tutor/router.py → classify_route)</text>
<rect x="640.0" y="710" width="520" height="52" rx="0" fill="#fff" stroke="#111" stroke-width="1.4"/>
<text x="900.0" y="739.5" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="12" fill="#111">Inputs: question, optional code, optional history (Gradio only)</text>
<line x1="900.0" y1="762" x2="900.0" y2="772" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>
<polygon points="900.0,772.0 1050.0,822.0 900.0,872.0 750.0,822.0" fill="#fff" stroke="#111" stroke-width="1.4"/>
<text x="900.0" y="810.0" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="12" fill="#111">rule_route:</text>
<text x="900.0" y="826.0" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="12" fill="#111">MIIT hints → miit;</text>
<text x="900.0" y="842.0" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="12" fill="#111">code / prog hints → programming</text>
<line x1="900.0" y1="872" x2="900.0" y2="892" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="906.0" y="878.0" font-family="'Times New Roman', Times, serif" font-size="11" fill="#444">miss</text>
<polygon points="900.0,887.0 1050.0,942.0 900.0,997.0 750.0,942.0" fill="#fff" stroke="#111" stroke-width="1.4"/>
<text x="900.0" y="930.0" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="12" fill="#111">inherit_thread_route:</text>
<text x="900.0" y="946.0" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="12" fill="#111">follow-up cue or len ≤ 48;</text>
<text x="900.0" y="962.0" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="12" fill="#111">reuse last miit / programming</text>
<line x1="900.0" y1="992" x2="900.0" y2="1022" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="906.0" y="1003.0" font-family="'Times New Roman', Times, serif" font-size="11" fill="#444">miss</text>
<polygon points="900.0,1012.0 1050.0,1072.0 900.0,1132.0 750.0,1072.0" fill="#fff" stroke="#111" stroke-width="1.4"/>
<text x="900.0" y="1060.5" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="11" fill="#111">LLM router (GEMINI_TTS_NAMES_API_KEY):</text>
<text x="900.0" y="1075.5" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="11" fill="#111">JSON route; memory + .cache/router/</text>
<text x="900.0" y="1090.5" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="11" fill="#111">cache key = question + code only</text>
<line x1="900.0" y1="1122" x2="900.0" y2="1162" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="906.0" y="1138.0" font-family="'Times New Roman', Times, serif" font-size="11" fill="#444">route = other</text>
<polygon points="900.0,1182.0 1030.0,1217 900.0,1252.0 770.0,1217" fill="#fff" stroke="#111" stroke-width="1.4"/>
<text x="900.0" y="1213.0" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="12" fill="#111">inherit_thread_route</text>
<text x="900.0" y="1229.0" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="12" fill="#111">(remap other)</text>
<line x1="760.0" y1="1222" x2="420" y2="1222" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="596.0" y="1218.0" font-family="'Times New Roman', Times, serif" font-size="11" fill="#444">still other</text>
<rect x="120" y="1194" width="300" height="56" rx="0" fill="#f0f0f0" stroke="#111" stroke-width="1.4"/>
<text x="270.0" y="1217.0" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="11" fill="#111">OUT_OF_SCOPE_ANSWER</text>
<text x="270.0" y="1233.0" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="11" fill="#111">(no chat LLM)</text>
<line x1="900.0" y1="1280" x2="900.0" y2="1324" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="640.0" y="1324" width="520" height="48" rx="0" fill="#fff" stroke="#111" stroke-width="1.4"/>
<text x="900.0" y="1351.5" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="12" fill="#111">Classified: miit | programming | None (fallback path)</text>
<text x="80" y="1398" font-family="'Times New Roman', Times, serif" font-size="15" font-weight="bold" fill="#111">Phase IV — Conditional retrieval (tutor/knowledge.py)</text>
<polygon points="900.0,1426.0 1060.0,1471 900.0,1516.0 740.0,1471" fill="#fff" stroke="#111" stroke-width="1.4"/>
<text x="900.0" y="1467.0" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="11" fill="#111">Route = programming?</text>
<text x="900.0" y="1482.0" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="11" fill="#111">→ skip retrieval (passages = ∅)</text>
<line x1="900.0" y1="1471" x2="900.0" y2="1536" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="906.0" y="1499.5" font-family="'Times New Roman', Times, serif" font-size="11" fill="#444">miit / None</text>
<rect x="640.0" y="1536" width="520" height="88" rx="0" fill="#fff" stroke="#111" stroke-width="1.4"/>
<text x="900.0" y="1552.5" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="10" fill="#111">retrieve_miit: query = last 2 user turns +</text>
<text x="900.0" y="1567.5" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="10" fill="#111">question; requires looks_like_miit(query);</text>
<text x="900.0" y="1582.5" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="10" fill="#111">embed cosine ≥ MIIT_MIN_SIMILARITY (0.55);</text>
<text x="900.0" y="1597.5" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="10" fill="#111">top-k 3 / 5 (papers) / 12 (curriculum);</text>
<text x="900.0" y="1612.5" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="10" fill="#111">token overlap if index missing or 429</text>
<line x1="900.0" y1="1624" x2="900.0" y2="1636" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="80" y="1650" font-family="'Times New Roman', Times, serif" font-size="15" font-weight="bold" fill="#111">Phase V — Prompt construction and cloud generation</text>
<polygon points="900.0,1678.0 1060.0,1718 900.0,1758.0 740.0,1718" fill="#fff" stroke="#111" stroke-width="1.4"/>
<text x="900.0" y="1714.0" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="11" fill="#111">miit route OR</text>
<text x="900.0" y="1729.0" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="11" fill="#111">non-empty passages?</text>
<line x1="730.0" y1="1718" x2="600.0" y2="1778" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="671.0" y="1744.0" font-family="'Times New Roman', Times, serif" font-size="11" fill="#444">no</text>
<rect x="420.0" y="1753" width="260" height="44" rx="0" fill="#fff" stroke="#111" stroke-width="1.4"/>
<text x="550.0" y="1778.0" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111">build_general_tutor_messages</text>
<line x1="1070.0" y1="1718" x2="1200.0" y2="1778" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="1141.0" y="1744.0" font-family="'Times New Roman', Times, serif" font-size="11" fill="#444">yes</text>
<rect x="1120.0" y="1753" width="220" height="44" rx="0" fill="#fff" stroke="#111" stroke-width="1.4"/>
<text x="1230.0" y="1778.0" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" fill="#111">build_miit_messages</text>
<line x1="550.0" y1="1797" x2="900.0" y2="1826" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="1230.0" y1="1797" x2="900.0" y2="1826" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="900.0" y1="1818" x2="900.0" y2="1826" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="640.0" y="1826" width="520" height="72" rx="0" fill="#fff" stroke="#111" stroke-width="1.4"/>
<text x="900.0" y="1849.5" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="10" fill="#111">GeminiClient.generate or OpenRouterClient.generate</text>
<text x="900.0" y="1864.5" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="10" fill="#111">Sampling: MIIT T=0.7 / prog T=0.85; max TUTOR_CLOUD_MAX_TOKENS</text>
<text x="900.0" y="1879.5" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="10" fill="#111">429 → GEMINI_API_KEY_FALLBACK (chat only); strip ဆရာ့အဖြေ:</text>
<line x1="900.0" y1="1898" x2="900.0" y2="1916" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="80" y="1930" font-family="'Times New Roman', Times, serif" font-size="15" font-weight="bold" fill="#111">Phase VI — Gradio persistence and optional modalities</text>
<rect x="640.0" y="1948" width="520" height="78" rx="0" fill="#fff" stroke="#111" stroke-width="1.4"/>
<text x="900.0" y="1974.0" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="11" fill="#111">results/chats.json, tutor_sessions.jsonl;</text>
<text x="900.0" y="1990.0" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="11" fill="#111">optional edge-tts (Listen); human_scores.jsonl</text>
<text x="900.0" y="2006.0" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="11" fill="#111">(API/CLI: no chat persistence or thread inherit)</text>
<rect x="780.0" y="2043" width="240" height="44" rx="22" fill="#fff" stroke="#111" stroke-width="1.4"/>
<text x="900.0" y="2069.0" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="13" fill="#111">End: Burmese tutor response</text>
<rect x="80" y="3380" width="520" height="170" fill="#fafafa" stroke="#888" stroke-width="1" stroke-dasharray="6 4"/>
<text x="90" y="3402" font-family="'Times New Roman', Times, serif" font-size="12" fill="#333">Notation: rectangles = processes; diamonds =</text>
<text x="90" y="3418" font-family="'Times New Roman', Times, serif" font-size="12" fill="#333">decisions; cylinder = persistent store. HybridEngine</text>
<text x="90" y="3434" font-family="'Times New Roman', Times, serif" font-size="12" fill="#333">(tutor/hybrid.py) orchestrates routing, retrieval,</text>
<text x="90" y="3450" font-family="'Times New Roman', Times, serif" font-size="12" fill="#333">prompting, and generation. Thread inheritance</text>
<text x="90" y="3466" font-family="'Times New Roman', Times, serif" font-size="12" fill="#333">applies only when Gradio supplies conversation</text>
<text x="90" y="3482" font-family="'Times New Roman', Times, serif" font-size="12" fill="#333">history.</text>
<rect x="620" y="3380" width="520" height="170" fill="#fafafa" stroke="#888" stroke-width="1" stroke-dasharray="6 4"/>
<text x="630" y="3402" font-family="'Times New Roman', Times, serif" font-size="12" fill="#333">External services: Google Gemini (chat +</text>
<text x="630" y="3418" font-family="'Times New Roman', Times, serif" font-size="12" fill="#333">embeddings), optional OpenRouter for chat, edge-tts</text>
<text x="630" y="3434" font-family="'Times New Roman', Times, serif" font-size="12" fill="#333">for speech. Router and TTS name mapping use</text>
<text x="630" y="3450" font-family="'Times New Roman', Times, serif" font-size="12" fill="#333">GEMINI_TTS_NAMES_API_KEY separately from chat.</text>
<rect x="1160" y="3380" width="560" height="170" fill="#fafafa" stroke="#888" stroke-width="1" stroke-dasharray="6 4"/>
<text x="1170" y="3402" font-family="'Times New Roman', Times, serif" font-size="12" fill="#333">Scope boundary: non-MIIT and non-programming queries</text>
<text x="1170" y="3418" font-family="'Times New Roman', Times, serif" font-size="12" fill="#333">receive OUT_OF_SCOPE_ANSWER without calling the chat</text>
<text x="1170" y="3434" font-family="'Times New Roman', Times, serif" font-size="12" fill="#333">model. Unclassified asks (no router key) fall</text>
<text x="1170" y="3450" font-family="'Times New Roman', Times, serif" font-size="12" fill="#333">through to retrieve_miit as a safety net.</text></svg>