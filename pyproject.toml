[project]
name = "myanmar-programming-tutor"
version = "0.3.0"
description = "MIIT programming tutor. Gemini answers programming questions in Burmese. MIIT faculty and curriculum use embedding retrieval over local notes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
]

[project.optional-dependencies]
app = [
    "edge-tts>=6.1",
    "pyjwt>=2.0",
    "litestar>=2.0",
    "uvicorn[standard]>=0.30",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "psutil>=6.0.0",
    "numpy>=1.26.0",
    "google-genai>=1.0.0",
]
aaa = [
    "pwdlib[argon2]>=0.2",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "advanced-alchemy[uuid]>=0.9.0",
    "alembic>=1.13.0",
    "pydantic[email]>=2.0",
    "pymupdf>=1.24.0",
]
report = [
    "python-docx>=1.1.0",
    "matplotlib>=3.8.0",
    "pillow>=10.0.0",
    "pymupdf>=1.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
