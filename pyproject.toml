[project]
name = "myanmar-programming-tutor"
version = "0.3.0"
description = "MIIT programming tutor. Gemini answers programming questions in Burmese. MIIT faculty and curriculum use embedding retrieval over local notes."
readme = "README.md"
requires-python = ">=3.12"

[project.optional-dependencies]
app = [
    "gradio>=4.0",
    "edge-tts>=6.1",
    "litestar>=2.0",
    "uvicorn[standard]>=0.30",
    "pytest>=8.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "psutil>=6.0.0",
    "numpy>=1.26.0",
    "google-genai>=1.0.0",
]
report = [
    "python-docx>=1.1.0",
    "matplotlib>=3.8.0",
    "pillow>=10.0.0",
    "pymupdf>=1.24.0",
]
